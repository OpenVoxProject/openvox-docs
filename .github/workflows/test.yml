---
name: Pull Request Tests

on:
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  rake_checks:
    name: Rake Checks
    runs-on: ubuntu-24.04
    steps:
      # needs fetch-depth because the packaging dem reads old git tags
      - name: Checkout current PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Ruby version 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Display Ruby environment
        run: bundle env
      - name: Run rake rubocop
        run: bundle exec rake rubocop
      - name: Run unit tests
        run: bundle exec rake spec
      - name: Validate products.yml
        run: bundle exec rake test:products_data
      - name: Validate code
        run: bundle exec jekyll build

  internal_links:
    name: Internal links
    runs-on: ubuntu-24.04
    steps:
      # needs fetch-depth because the packaging gem reads old git tags
      - name: Checkout current PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Ruby version 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      # pandoc renders the openvox man-page references; mandoc renders the
      # openfact CLI references (see lib/puppet_references/).
      # pandoc comes from its GitHub release because the runners' Ubuntu mirror
      # sometimes serves the 27 MB package at a few kB/s. 3.1.3 is the version
      # Ubuntu 24.04 ships, so the generated pages don't change. Keep this step
      # the same as the one in build.yaml.
      - name: Install pandoc and mandoc
        env:
          PANDOC_VERSION: 3.1.3
          PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc
        run: |
          curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  /tmp/pandoc.deb" | sha256sum --check
          sudo apt-get install -y --no-install-recommends /tmp/pandoc.deb mandoc
      # The link check covers every collection, and the shared site-wide sidebar
      # links into the generated reference pages, so the whole site (including
      # those generated pages) must exist. Generate every collection's references
      # into docs/ first, the same way the publish workflow does.
      - name: Generate reference docs
        run: |
          bundle exec rake references:all INSTALLPATH=docs
      - name: Build site
        run: bundle exec jekyll build
      - name: Check internal links
        run: bundle exec rake test:links

  tests:
    if: always()
    needs:
      - rake_checks
      - internal_links
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
