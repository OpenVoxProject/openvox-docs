openvox-containers:
  label: OpenVox Containers
  latest: latest
  single_version: true  # real `_latest` dir, no numbered collection (see header)
  versions:
    - id: latest
      label: latest
      collection: _openvox-containers_latest
      base: /openvox-containers/latest/
